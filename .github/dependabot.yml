# Weekly update PRs for the app's npm packages, the rules-test tools and the GitHub Actions used to deploy.
# Nothing merges on its own: each PR still needs a review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /firebase/test
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
